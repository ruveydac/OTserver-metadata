name: Metadata CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog schema and references
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema[format-nongpl]==4.25.1'
      - run: python scripts/validate_catalog.py
      - run: python -m unittest discover -s scripts -p 'test_validate_catalog.py'
